name: Deploy web app to GitHub Pages

# OPTIONAL Actions-based deploy. Use this only if you set
# Settings -> Pages -> Source = "GitHub Actions".
#
# The simplest path needs NO workflow at all:
#   Settings -> Pages -> Source = "Deploy from a branch"
#   -> pick this branch and the "/docs" folder -> Save.
#
# NOTE: GitHub does not allow a workflow to enable Pages for the first time
# ("Resource not accessible by integration"). Pages must be turned on once in
# Settings; after that this workflow can deploy on demand.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site (./docs)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
